[project]
name = "risk-intelligence"
version = "0.1.0"
description = "Calibrated credit-risk scoring and governed decision support"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]
[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23"]
ui = ["streamlit>=1.28"]
explain = ["shap>=0.42"]
lightgbm = ["lightgbm>=4.0"]
test = ["pytest>=7.0", "httpx>=0.24"]
[project.scripts]
risk-train = "credit_risk.pipeline:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
